services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"   # localhost only — never expose Redis publicly
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zkgate
      POSTGRES_USER: zkgate
      # From .env (git-ignored) — see .env.example. Never hardcode it here.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432"   # localhost only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zkgate -d zkgate"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://zkgate:${POSTGRES_PASSWORD}@postgres:5432/zkgate
      - ENVIRONMENT=development
      - CIRCUIT_KEYS_DIR=/app/circuits/keys
    # Container hardening: read-only root fs, no capabilities, no escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app:ro
      - ./circuits/keys:/app/circuits/keys:ro

volumes:
  redis_data:
  postgres_data:
